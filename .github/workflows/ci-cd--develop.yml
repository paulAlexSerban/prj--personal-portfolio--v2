name: CI/CD - Develop

on:
  push:
    branches:
      - develop
      - main
      - releases/*
  pull_request:
    types: [synchronize]
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "develop"
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.0
  FE_NEXTJS_PROJECT_ROOT: frontend/portfolio-website
  SITE_URL: "https://prj--personal-portfolio.github.io/portfolio-website-v2"
  ASSETS_PATH: ${{ secrets.ASSETS_PATH }}
  NODE_ENV: production

jobs:
  deploy:
    name: "Deploy to GitHub Pages (Test/Stage)"
    runs-on: ubuntu-latest

    steps:
      - name: "📥  Checkout repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "🔍  Verify Changed Files"
        uses: tj-actions/changed-files@v47
        id: changed-frontend-portfolio-website-files
        with:
          files: ${{ env.FE_NEXTJS_PROJECT_ROOT }}/**/*

      - name: "🔄  Cache node_modules"
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: "🔧  Setup NodeJS ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "🔧  Install project modules dependencies"
        run: |
          npm --prefix frontend/portfolio-website install

      - name: "Build"
        run: |
          npm --prefix frontend/portfolio-website run build:prod
        env:
          # Increase Node.js network timeout for font fetching
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Add retry logic for network requests
          NEXT_TELEMETRY_DISABLED: 1
        timeout-minutes: 15
        continue-on-error: false

      - name: "Package"
        run: |
          npm --prefix frontend/portfolio-website run package

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./package/prj--portfolio-website-v2
