name: CI/CD - PRODUCTION

on:
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "production"
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.0
  FE_NEXTJS_PROJECT_ROOT: frontend/portfolio-website
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SITE_URL: ${{ secrets.SITE_URL }}
  ASSETS_PATH: ${{ secrets.ASSETS_PATH }}
  SITE_HOSTNAME: ${{ secrets.SITE_HOSTNAME }}
  INDEX_NOW_API_KEY: ${{ secrets.INDEX_NOW_API_KEY }}
  S3_BUCKET_REGION: ${{ secrets.S3_BUCKET_REGION }}
  S3_CONTENT_PRODUCTION_BUCKET: ${{ secrets.S3_CONTENT_PRODUCTION_BUCKET }}
  NODE_ENV: production

jobs:
  deploy:
    name: "Deploy To PRODUCTION"
    runs-on: ubuntu-latest

    steps:
      - name: "📥  Checkout repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "🔍  Verify Changed Files"
        uses: tj-actions/changed-files@v47
        id: changed-frontend-portfolio-website-files
        with:
          files: ${{ env.FE_NEXTJS_PROJECT_ROOT }}/**/*

      - name: "🔄  Cache node_modules"
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: "🔧  Setup NodeJS ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "🔧  Install project modules dependencies"
        run: |
          npm --prefix frontend/portfolio-website install

      - name: "Build"
        run: |
          npm --prefix frontend/portfolio-website run build:prod
        env:
          # Increase Node.js network timeout for font fetching
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Add retry logic for network requests
          NEXT_TELEMETRY_DISABLED: 1
        timeout-minutes: 15
        continue-on-error: false

      - name: "Package"
        run: |
          npm --prefix frontend/portfolio-website run package

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_BUCKET_REGION }}

      - name: "Deploy  to bucket"
        run: aws s3 sync ./package/prj--portfolio-website/ s3://${{ secrets.S3_PRODUCTION_BUCKET }} --delete

      - name: "Invalidate  cloudfront"
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_PRODUCTION_DISTRIBUTION_ID }} --paths "/"
